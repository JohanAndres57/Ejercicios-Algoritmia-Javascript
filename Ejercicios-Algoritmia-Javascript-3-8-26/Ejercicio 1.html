<body>
    <script>
       for (let numero = 1; numero <= 100; numero++){
        if (numero % 3 === 0 && numero % 5 === 0) {
        console.log("FrizzBuzz");
    } else if (numero % 3 === 0) {
        console.log("Frizz");
    } else if (numero % 5 === 0) {
        console.log("Buzz"); 
    } else {
        console.log(numero);
    }
       }
    

    </script>
