<!DOCTYPE html>

<head>

</head>
<body>
    <script>
     function sumarDigitos(numero) {
        let suma = 0;

        while (numero > 0) {
            
            let digito = numero % 10;
            suma += digito;
            numero = Math.floor(numero / 10);
        }
        return suma;
     }
     console.log(sumarDigitos(1234)); 
     console.log(sumarDigitos(905));  
     console.log(sumarDigitos(50379)); 
    </script>
</body>
</html>
